[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "a8se-push"
version = "0.2.0"
description = "Worker de notificações push de notícias do a8se.com para o app Sistema Atalaia"
requires-python = ">=3.11"
dependencies = [
    "firebase-admin>=6.5",
    "httpx>=0.27",
    "tzdata",  # zoneinfo em sistemas sem base de fusos (Windows, containers mínimos)
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
a8se-push = "a8se_push.cli:main"

[tool.setuptools.packages.find]
include = ["a8se_push*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
